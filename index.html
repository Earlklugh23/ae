<!DOCTYPE html>
<html lang="ko">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --font-scale: 1;
    }
    body {
      font-family: 'Pretendard', sans-serif;
    }
    .stock-title-text {
      font-size: calc(15px * var(--font-scale, 1));
    }
    .stock-price-text {
      font-size: calc(16px * var(--font-scale, 1));
    }
    .stock-metric-text {
      font-size: calc(12.5px * var(--font-scale, 1));
    }
    .stock-desc-text {
      font-size: calc(12px * var(--font-scale, 1));
      line-height: 1.6;
    }
    .badge-text {
      font-size: calc(11px * var(--font-scale, 1));
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.03);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 9999px;
    }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>

  <script>
    (function generateStockBlueIconPng() {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 180;
        canvas.height = 180;
        const ctx = canvas.getContext('2d');

        // 1. 블루 / 인디고 그라데이션 배경 (Blue Edition)
        const bgGrad = ctx.createLinearGradient(0, 0, 180, 180);
        bgGrad.addColorStop(0, '#2563eb'); // blue-600
        bgGrad.addColorStop(1, '#4f46e5'); // indigo-600
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 180, 180);

        // 2. 우측 상단 은은한 원형 장식 효과
        ctx.beginPath();
        ctx.arc(140, 40, 36, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.fill();

        // 3. 차트 라인 (그리드 보조선)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(25, 145);
        ctx.lineTo(155, 145);
        ctx.stroke();

        // 4. 상승 꺾은선 차트 그래프 및 화살표
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 12;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(35, 125);
        ctx.lineTo(70, 95);
        ctx.lineTo(105, 115);
        ctx.lineTo(145, 52);
        ctx.stroke();

        // 화살표 촉
        ctx.beginPath();
        ctx.moveTo(145, 52);
        ctx.lineTo(118, 55);
        ctx.lineTo(142, 79);
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        // 5. 차트 포인트 원형 강조점
        const points = [
          { x: 35, y: 125 },
          { x: 70, y: 95 },
          { x: 105, y: 115 }
        ];
        points.forEach(pt => {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
        });

        const pngUrl = canvas.toDataURL('image/png');
        document.addEventListener('DOMContentLoaded', () => {
          const appleIcon = document.getElementById('dynamicAppleIcon');
          const favicon = document.getElementById('dynamicFavicon');
          if (appleIcon) appleIcon.href = pngUrl;
          if (favicon) favicon.href = pngUrl;
        });
      } catch (e) {
        console.warn('Canvas icon generation error:', e);
      }
    })();
  </script>
</head>

  <script>
    // 전달해주신 신규 구글 스프레드시트 ID 및 GID
    let spreadsheetId = '1J7G5gIkbE66U2U06BxjyKzTPBLDugxnB4D8fcViWvvk';
    let sheetGid = '0';

    function loadViaJSONP(id, gid, isManual, onFail) {
      const callbackName = 'googleSheetStockBlueJSONPCallback_' + Math.floor(Math.random() * 1000000);
      let isHandled = false;

      if (jsonpTimeoutId) clearTimeout(jsonpTimeoutId);
      jsonpTimeoutId = setTimeout(() => {
        if (!isHandled) {
          isHandled = true;
          cleanupScript();
          onFail();
        }
      }, 5000);

      const script = document.createElement('script');
      script.id = callbackName;
      const gidParam = gid ? `&gid=${gid}` : '';
      script.src = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=responseHandler:${callbackName}${gidParam}&headers=1&t=${Date.now()}`;

      window[callbackName] = function(response) {
        if (isHandled) return;
        isHandled = true;
        clearTimeout(jsonpTimeoutId);
        cleanupScript();

        if (response && response.table) {
          const parsedResult = parseGVizData(response);
          if (parsedResult && parsedResult.stocks && parsedResult.stocks.length > 0) {
            // 구글파이낸스 연산 중 상태가 감지된 경우 재시도 처리
            if (parsedResult.hasPendingFormulas && calcRetryCount < MAX_CALC_RETRIES) {
              triggerCalculationRetry(isManual);
              return;
            }
            handleSuccessFetch(parsedResult.stocks, isManual, '실시간 연동');
            return;
          }
        }
        onFail();
      };

      script.onerror = function() {
        if (isHandled) return;
        isHandled = true;
        clearTimeout(jsonpTimeoutId);
        cleanupScript();
        onFail();
      };

      function cleanupScript() {
        const el = document.getElementById(callbackName);
        if (el && el.parentNode) el.parentNode.removeChild(el);
        delete window[callbackName];
      }

      document.body.appendChild(script);
    }

    async function fallbackFetchEndpoints(isManual) {
      const endpoints = [
        `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:json${sheetGid ? `&gid=${sheetGid}` : ''}`,
        `https://docs.google.com/spreadsheets/d/${spreadsheetId}/export?format=csv${sheetGid ? `&gid=${sheetGid}` : ''}`,
        `https://docs.google.com/spreadsheets/d/${spreadsheetId}/export?format=csv`
      ];

      let success = false;
      for (const url of endpoints) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const text = await res.text();

          if (url.includes('tqx=out:json')) {
            const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]+)\);/);
            if (match && match[1]) {
              const data = JSON.parse(match[1]);
              const parsedResult = parseGVizData(data);
              if (parsedResult.stocks && parsedResult.stocks.length > 0) {
                if (parsedResult.hasPendingFormulas && calcRetryCount < MAX_CALC_RETRIES) {
                  triggerCalculationRetry(isManual);
                  return;
                }
                handleSuccessFetch(parsedResult.stocks, isManual, '실시간 연동');
                success = true;
                break;
              }
            }
          } else {
            const parsedResult = parseCSVData(text);
            if (parsedResult.stocks && parsedResult.stocks.length > 0) {
              if (parsedResult.hasPendingFormulas && calcRetryCount < MAX_CALC_RETRIES) {
                triggerCalculationRetry(isManual);
                return;
              }
              handleSuccessFetch(parsedResult.stocks, isManual, 'CSV 동기화');
              success = true;
              break;
            }
          }
        } catch (e) {}
      }

      if (!success) {
        handleFailFetch();
      }
    }

    function isPendingFormulaValue(val) {
      if (!val) return false;
      const str = String(val).toLowerCase().trim();
      return str.includes('#n/a') || 
             str.includes('loading') || 
             str.includes('로딩') || 
             str.includes('#value!') || 
             str.includes('#ref!') || 
             str.includes('#name?') ||
             str.includes('로딩 중');
    }

    function parseGVizData(gviz) {
      if (!gviz.table || !gviz.table.rows) return { stocks: [], hasPendingFormulas: false };
      const cols = gviz.table.cols || [];
      const rows = gviz.table.rows || [];

      const headers = cols.map((c, i) => (c && c.label) ? c.label.trim() : `Col_${i}`);
      setupConditionColumns(headers);

      const parsed = [];
      let pendingFormulaCount = 0;

      rows.forEach((rowObj) => {
        const c = rowObj.c || [];
        const values = c.map(cell => (cell && cell.v !== null && cell.v !== undefined) ? String(cell.v).trim() : '');
        if (values.every(v => !v)) return;

        const isPendingRow = values.some(v => isPendingFormulaValue(v));
        if (isPendingRow) pendingFormulaCount++;

        const stock = extractStockFields(values, headers);
        if (stock.name) parsed.push(stock);
      });

      return {
        stocks: parsed,
        hasPendingFormulas: pendingFormulaCount > 0
      };
    }

    function parseCSVData(csvText) {
      const lines = csvText.split(/\r?\n/).filter(line => line.trim().length > 0);
      if (lines.length === 0) return { stocks: [], hasPendingFormulas: false };

      const rows = lines.map(line => parseCSVLine(line));
      const headers = rows[0] || [];
      setupConditionColumns(headers);

      const dataRows = rows.slice(1);
      const parsed = [];
      let pendingFormulaCount = 0;

      dataRows.forEach(row => {
        const isPendingRow = row.some(v => isPendingFormulaValue(v));
        if (isPendingRow) pendingFormulaCount++;

        const stock = extractStockFields(row, headers);
        if (stock.name) parsed.push(stock);
      });

      return {
        stocks: parsed,
        hasPendingFormulas: pendingFormulaCount > 0
      };
    }

    function setupConditionColumns(headers) {
      conditionColumns = PRESET_CONDITIONS.map(preset => {
        let matchedIndex = preset.targetCol;
        if (headers && headers.length > 0) {
          headers.forEach((h, idx) => {
            if (!h) return;
            const normH = h.toLowerCase().replace(/\s+/g, '');
            if (preset.key.includes('50') && normH.includes('50') && normH.includes('돌파') && preset.key === 'cond_50_break') matchedIndex = idx;
            else if (preset.key.includes('50') && normH.includes('50') && !normH.includes('돌파') && preset.key.includes('above')) matchedIndex = idx;
            else if (preset.key.includes('200') && normH.includes('200') && preset.key.includes('above')) matchedIndex = idx;
          });
        }
        return {
          key: preset.key,
          title: preset.title,
          type: preset.type,
          index: matchedIndex,
          checkFn: preset.check
        };
      });
    }

    function extractStockFields(values, headers) {
      let name = '';
      let code = '';
      let price = '-';
      let per = '-';
      let desc = '';
      let chartUrl = '';
      let financeUrl = '';

      // AK열 (37번째 열, 인덱스 36) 값을 메모로 엄격 지정
      if (values[36] && values[36].trim()) {
        desc = values[36].trim();
      }

      // 휴리스틱 매핑
      headers.forEach((h, idx) => {
        const val = values[idx] || '';
        if (/종목명|회사명|기업명|^name$|^ticker$/i.test(h) && !name) {
          name = val;
        } else if (/종목코드|^code$|^symbol$/i.test(h) && !code) {
          code = val;
        } else if (/현재가|종가|^price$|^close$/i.test(h) && price === '-') {
          price = val;
        } else if (/^per$|^p\/e$|주가수익비율/i.test(h) && per === '-') {
          per = val;
        } else if (/차트|그래프|chart/i.test(h) && /^https?:\/\//i.test(val)) {
          chartUrl = val;
        } else if (/재무|재무제표|financial/i.test(h) && /^https?:\/\//i.test(val)) {
          financeUrl = val;
        }
      });

      if (!name) name = values[0] || values[1] || '';
      if (!code && /^[0-9]{6}$/.test(values[1])) code = values[1];
      if (price === '-' && values[1] && /[0-9,.]+/.test(values[1]) && !code) price = values[1];
      if (price === '-' && values[2] && /[0-9,.]+/.test(values[2])) price = values[2];
      if (per === '-' && values[3] && /[0-9.]+/.test(values[3])) per = values[3];

      // 조건 검사
      const conditions = {};
      conditionColumns.forEach(col => {
        let isTrue = false;
        const val = (values[col.index] || '').trim();
        if (col.checkFn) {
          isTrue = col.checkFn(val);
        } else {
          isTrue = /^(O|Y|YES|TRUE|1|적합|상회|돌파|달성|포함|위|급등|급락)$/i.test(val);
        }
        conditions[col.key] = isTrue;
      });

      // 차트 및 재무 링크 생성
      const cleanCode = (code || '').replace(/[^0-9a-zA-Z]/g, '');

      if (!chartUrl) {
        if (/^[0-9]{6}$/.test(cleanCode)) {
          chartUrl = `https://finance.naver.com/item/fchart.naver?code=${cleanCode}`;
        } else if (cleanCode) {
          chartUrl = `https://kr.tradingview.com/symbols/${cleanCode}/`;
        } else {
          chartUrl = `https://finance.naver.com/search/searchList.naver?query=${encodeURIComponent(name)}`;
        }
      }

      if (!financeUrl) {
        if (/^[0-9]{6}$/.test(cleanCode)) {
          financeUrl = `https://finance.naver.com/item/coinfo.naver?code=${cleanCode}`;
        } else if (cleanCode) {
          financeUrl = `https://finance.yahoo.com/quote/${cleanCode}/financials/`;
        } else {
          financeUrl = `https://m.stock.naver.com/domestic/stock/${cleanCode || encodeURIComponent(name)}/finance`;
        }
      }

      return {
        id: generateHash(name + code + price),
        name: name,
        code: code,
        price: formatPrice(price),
        per: formatPER(per),
        desc: desc,
        conditions: conditions,
        chartUrl: chartUrl,
        financeUrl: financeUrl
      };
    }

    function parseCSVLine(text) {
      let p = '', row = [''], i = 0, s = true;
      for (let l of text) {
        if ('"' === l) {
          if (s && l === p) row[i] += l;
          s = !s;
        } else if (',' === l && s) row[i] = '';
        else if ('\n' === l && s) {
          if ('\r' === p) row[i] = row[i].slice(0, -1);
          row = [''];
          i = 0;
        } else row[i] += l;
        p = l;
      }
      return row;
    }

    function generateHash(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return 'stock_' + Math.abs(hash);
    }

    function formatPrice(val) {
      if (!val || val === '-') return '-';
      const num = parseFloat(val.replace(/[^0-9.-]/g, ''));
      if (isNaN(num)) return val;
      if (num >= 100) return num.toLocaleString('ko-KR') + '원';
      return '$' + num.toFixed(2);
    }

    function formatPER(val) {
      if (!val || val === '-') return '-';
      const num = parseFloat(val.replace(/[^0-9.-]/g, ''));
      if (isNaN(num)) return val;
      return num.toFixed(1) + '배';
    }

    function useMockData() {
      setupConditionColumns([]);
      rawStocks = MOCK_STOCKS.map((s, idx) => ({
        id: 'mock_' + idx,
        name: s.name,
        code: s.code,
        price: s.price,
        per: s.per + '배',
        desc: s.desc,
        conditions: { ...s.conditions },
        chartUrl: s.chartUrl,
        financeUrl: s.financeUrl
      }));
      document.getElementById('lastSyncedTime').innerText = '샘플 데이터 모드';
      renderConditionChips();
      renderAll();
    }

    function renderConditionChips() {
      const container = document.getElementById('conditionFilterChips');
      container.innerHTML = '';

      if (conditionColumns.length === 0) {
        container.innerHTML = '<span class="text-slate-400 text-xs">사용 가능한 조건 열이 없습니다.</span>';
        return;
      }

      conditionColumns.forEach(col => {
        const isSelected = activeConditions.has(col.key);
        const count = rawStocks.filter(s => s.conditions[col.key]).length;
        const isUp = col.type === 'up';

        const btn = document.createElement('button');
        btn.onclick = () => toggleCondition(col.key);

        let chipClass = '';
        let iconHtml = '';
        let badgeClass = '';

        if (isUp) {
          // 상승/돌파 계열 (붉은색 테마)
          if (isSelected) {
            chipClass = 'bg-rose-600 text-white border border-rose-500 shadow-rose-500/20';
            iconHtml = '<i class="fa-solid fa-circle-check text-rose-200 text-[10px]"></i>';
            badgeClass = 'bg-rose-800 text-white';
          } else {
            chipClass = 'bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300 hover:bg-rose-100 dark:hover:bg-rose-900/60 border border-rose-200 dark:border-rose-900/80';
            iconHtml = '<i class="fa-solid fa-arrow-trend-up text-rose-500 text-[10px]"></i>';
            badgeClass = 'bg-white dark:bg-rose-900 text-rose-600 dark:text-rose-300';
          }
        } else {
          // 하락/이탈 계열 (파란색 테마)
          if (isSelected) {
            chipClass = 'bg-blue-600 text-white border border-blue-500 shadow-blue-500/20';
            iconHtml = '<i class="fa-solid fa-circle-check text-blue-200 text-[10px]"></i>';
            badgeClass = 'bg-blue-800 text-white';
          } else {
            chipClass = 'bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300 hover:bg-blue-100 dark:hover:bg-blue-900/60 border border-blue-200 dark:border-blue-900/80';
            iconHtml = '<i class="fa-solid fa-arrow-trend-down text-blue-500 text-[10px]"></i>';
            badgeClass = 'bg-white dark:bg-blue-900 text-blue-600 dark:text-blue-300';
          }
        }

        btn.className = `px-3 py-1.5 rounded-xl font-semibold transition flex items-center space-x-1.5 shadow-sm active:scale-95 ${chipClass}`;

        btn.innerHTML = `
          ${iconHtml}
          <span class="badge-text">${col.title}</span>
          <span class="text-[10px] px-1.5 py-0.2 rounded-full font-bold ${badgeClass}">${count}</span>
        `;
        container.appendChild(btn);
      });
    }

    function toggleCondition(key) {
      if (activeConditions.has(key)) {
        activeConditions.delete(key);
      } else {
        activeConditions.add(key);
      }
      renderConditionChips();
      renderAll();
    }

    function resetConditions() {
      activeConditions.clear();
      renderConditionChips();
      renderAll();
    }

    function getFilteredStocks() {
      let result = rawStocks.filter(stock => {
        // 다중 조건 필터
        if (activeConditions.size > 0) {
          for (let condKey of activeConditions) {
            if (!stock.conditions[condKey]) return false;
          }
        }

        // 검색어 필터
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchName = stock.name.toLowerCase().includes(q);
          const matchCode = stock.code.toLowerCase().includes(q);
          const matchDesc = stock.desc.toLowerCase().includes(q);
          if (!matchName && !matchCode && !matchDesc) return false;
        }

        return true;
      });

      // 정렬
      if (currentSort === 'price_desc') {
        result.sort((a, b) => parseNumeric(b.price) - parseNumeric(a.price));
      } else if (currentSort === 'price_asc') {
        result.sort((a, b) => parseNumeric(a.price) - parseNumeric(b.price));
      } else if (currentSort === 'per_asc') {
        result.sort((a, b) => parseNumeric(a.per) - parseNumeric(b.per));
      } else if (currentSort === 'per_desc') {
        result.sort((a, b) => parseNumeric(b.per) - parseNumeric(a.per));
      } else if (currentSort === 'name_asc') {
        result.sort((a, b) => a.name.localeCompare(b.name, 'ko-KR'));
      }

      return result;
    }

    function parseNumeric(str) {
      if (!str || str === '-') return 99999999;
      const n = parseFloat(str.replace(/[^0-9.-]/g, ''));
      return isNaN(n) ? 99999999 : n;
    }

    function renderAll() {
      const stocks = getFilteredStocks();
      document.getElementById('totalCount').innerText = rawStocks.length;
      document.getElementById('filteredCount').innerText = stocks.length;

      const emptyState = document.getElementById('emptyState');
      const gridContainer = document.getElementById('stockGridContainer');

      if (stocks.length === 0) {
        emptyState.classList.remove('hidden');
        gridContainer.classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      gridContainer.classList.remove('hidden');
      renderStockCards(stocks);
    }

    function renderStockCards(stocks) {
      const container = document.getElementById('stockGridContainer');
      container.innerHTML = '';

      stocks.forEach(stock => {
        const card = document.createElement('div');
        card.className = 'group relative bg-white dark:bg-slate-800/90 hover:bg-slate-50/50 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-700/80 hover:border-blue-500/80 dark:hover:border-blue-500 rounded-2xl p-4 flex flex-col justify-between transition-all duration-200 shadow-sm hover:shadow-md';

        // 해당 종목이 만족하는 조건 뱃지 생성
        let activeBadgesHtml = '';
        conditionColumns.forEach(col => {
          if (stock.conditions[col.key]) {
            const isUp = col.type === 'up';
            if (isUp) {
              activeBadgesHtml += `
                <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold bg-rose-50 text-rose-700 dark:bg-rose-950/80 dark:text-rose-300 border border-rose-200 dark:border-rose-900">
                  <i class="fa-solid fa-arrow-trend-up text-[9px] mr-1 text-rose-500"></i>${col.title}
                </span>
              `;
            } else {
              activeBadgesHtml += `
                <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold bg-blue-50 text-blue-700 dark:bg-blue-950/80 dark:text-blue-300 border border-blue-200 dark:border-blue-900">
                  <i class="fa-solid fa-arrow-trend-down text-[9px] mr-1 text-blue-500"></i>${col.title}
                </span>
              `;
            }
          }
        });

        card.innerHTML = `
          <div>
            <!-- 상단: 종목명, 티커코드 -->
            <div class="flex items-start justify-between gap-2 mb-2.5">
              <div class="min-w-0 flex-1">
                <div class="flex items-center space-x-1.5 flex-wrap">
                  <h2 class="stock-title-text font-extrabold text-slate-900 dark:text-white truncate" title="${stock.name}">
                    ${stock.name}
                  </h2>
                  ${stock.code ? `<span class="font-mono text-xs px-1.5 py-0.2 rounded bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 font-semibold">${stock.code}</span>` : ''}
                </div>
              </div>
            </div>

            <!-- 만족하는 조건 태그 목록 -->
            ${activeBadgesHtml ? `<div class="flex items-center flex-wrap gap-1 mb-3">${activeBadgesHtml}</div>` : ''}

            <!-- 핵심 재무 지표: 현재가 & PER (블루 테마) -->
            <div class="grid grid-cols-2 gap-2 bg-slate-50 dark:bg-slate-900/60 rounded-xl p-2.5 mb-3 border border-slate-100 dark:border-slate-700/60">
              <div>
                <span class="text-[11px] text-slate-400 font-medium block">현재가</span>
                <span class="stock-price-text font-mono font-bold text-blue-600 dark:text-blue-400">
                  ${stock.price}
                </span>
              </div>
              <div>
                <span class="text-[11px] text-slate-400 font-medium block">PER (주가수익비율)</span>
                <span class="stock-metric-text font-mono font-bold text-slate-800 dark:text-slate-200">
                  ${stock.per}
                </span>
              </div>
            </div>

            <!-- 종목 메모 (AK열) -->
            <div class="mb-3.5">
              <span class="text-[11px] text-slate-400 font-bold block mb-0.5">메모:</span>
              <p class="stock-desc-text text-slate-600 dark:text-slate-300 min-h-[3.2em] line-clamp-3 break-words bg-white dark:bg-slate-800/40 p-2 rounded-lg border border-slate-100 dark:border-slate-700/50">
                ${stock.desc || ''}
              </p>
            </div>
          </div>

          <!-- 하단: 그래프 및 재무제표 바로가기 링크 버튼 (블루 테마) -->
          <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100 dark:border-slate-700/60 text-xs">
            <a href="${stock.chartUrl}" target="_blank" class="inline-flex items-center justify-center px-3 py-2 rounded-xl font-bold text-blue-700 bg-blue-50 hover:bg-blue-600 hover:text-white dark:bg-blue-950/60 dark:text-blue-300 dark:hover:bg-blue-600 dark:hover:text-white border border-blue-200 dark:border-blue-800 transition active:scale-95 shadow-sm" title="${stock.name} 차트 보기">
              <i class="fa-solid fa-chart-candlestick mr-1.5 text-xs"></i>
              <span>그래프</span>
            </a>

            <a href="${stock.financeUrl}" target="_blank" class="inline-flex items-center justify-center px-3 py-2 rounded-xl font-bold text-blue-700 bg-blue-50 hover:bg-blue-600 hover:text-white dark:bg-blue-950/60 dark:text-blue-300 dark:hover:bg-blue-600 dark:hover:text-white border border-blue-200 dark:border-blue-800 transition active:scale-95 shadow-sm" title="${stock.name} 재무제표 보기">
              <i class="fa-solid fa-file-invoice-dollar mr-1.5 text-xs"></i>
              <span>재무제표</span>
            </a>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function handleSearch(val) {
      searchQuery = val.trim();
      const clearBtn = document.getElementById('clearSearchBtn');
      if (searchQuery) clearBtn.classList.remove('hidden');
      else clearBtn.classList.add('hidden');
      renderAll();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      searchQuery = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderAll();
    }

    function handleSortChange(sortVal) {
      currentSort = sortVal;
      renderAll();
    }

    function openSettingsModal() {
      document.getElementById('modalSheetInput').value = spreadsheetId;
      document.getElementById('modalGidInput').value = sheetGid || '0';
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function saveSettingsAndSync() {
      const input = document.getElementById('modalSheetInput').value.trim();
      const gidInput = document.getElementById('modalGidInput').value.trim();

      if (input) {
        const idMatch = input.match(/\/d\/([a-zA-Z0-9-_]+)/);
        spreadsheetId = (idMatch && idMatch[1]) ? idMatch[1] : input;

        const gidMatch = input.match(/[#&?]gid=([0-9]+)/);
        sheetGid = (gidMatch && gidMatch[1]) ? gidMatch[1] : (gidInput || '0');

        try {
          sessionStorage.setItem(SETTINGS_KEY, JSON.stringify({ id: spreadsheetId, gid: sheetGid }));
        } catch (e) {}

        updateSheetLink();
        closeSettingsModal();
        fetchSheetData(true);
      }
    }

    function initTheme() {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
        updateThemeIcon(true);
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      updateThemeIcon(isDark);
    }

    function updateThemeIcon(isDark) {
      const icon = document.getElementById('themeIcon');
      if (isDark) {
        icon.className = 'fa-solid fa-sun text-amber-400 text-xs';
      } else {
        icon.className = 'fa-solid fa-moon text-xs';
      }
    }
  </script>
</body>
</html>
